name: clarilot

services:
  clarilot-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clarilot
      POSTGRES_USER: clarilot
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    ports:
      - "127.0.0.1:54360:5432"
    volumes:
      - clarilot_pgdata:/var/lib/postgresql/data
      - ./seed/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarilot -d clarilot"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  clarilot_pgdata: {}
